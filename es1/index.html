<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Illusione ottica animata</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #ffffff;
      }

      img {
        display: block;
        width: min(100vw, 640px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="./illusione-ottica.svg"
        alt="Illusione ottica animata con quattro cerchi neri che si separano e si ricongiungono."
      />
    </main>
  </body>
</html>
